<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#030705"><title>Elite Sport | Ingresar</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/img/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/main.css"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
<button class="btn btn-icon position-fixed top-0 end-0 m-3" style="z-index:10" onclick="toggleTema()"><i class="fa-solid fa-moon js-tema-icon"></i></button>
<div class="glass-card p-4 p-md-5 text-center reveal" style="max-width:440px;width:100%">
  <img src="assets/img/logo.png" height="90" class="mb-2" alt="" onerror="this.outerHTML='<div style=font-size:4rem>⚽</div>'">
  <h1 class="display-font display-4 mb-0">ELITE <span class="t-g">SPORT</span></h1><p class="t-m mb-4">Tienda oficial de camisetas 2026</p>
  <button class="btn btn-neon btn-lg w-100 mb-3 py-3" id="btnCliente"><i class="fa-solid fa-shirt me-2"></i>Entrar como cliente</button>
  <div class="t-m small mb-3">— o ingresa como administrador —</div>
  <form id="formAdmin" novalidate><input type="password" id="adminPass" class="form-control campo mb-2" placeholder="Contraseña de administrador" autocomplete="current-password">
  <button class="btn btn-ghost w-100 py-2"><i class="fa-solid fa-lock me-2"></i>Entrar al panel</button></form>
  <p class="t-m small mt-3 mb-0">Demo admin: <b>admin123</b></p>
  <button class="btn btn-link t-g js-instalar d-none mt-2" onclick="instalarApp()"><i class="fa-solid fa-download"></i> Instalar app</button>
</div>
<script type="module">
import { entrar, validarAdmin, getRol } from './js/core/auth.js';
import { inicializarTema } from './js/avances/tema.js';
import { inicializarAnimaciones, observarReveal } from './js/avances/animaciones.js';
import { iniciarHidratacion } from './js/avances/hidratacion.js';
import { registrarPWA } from './js/core/pwa.js';
import { toast } from './js/avances/alertas.js';
import { validarCampo } from './js/avances/validaciones.js';
inicializarTema(); inicializarAnimaciones(); iniciarHidratacion(); registrarPWA();
document.querySelector('.reveal').classList.add('visible');
document.getElementById('btnCliente').onclick = () => entrar('cliente');
document.getElementById('formAdmin').onsubmit = e => {
  e.preventDefault(); const i = document.getElementById('adminPass');
  if (!validarCampo(i, { req: 1, min: 4 })) return toast('Ingresa la contraseña', 'error');
  validarAdmin(i.value) ? (toast('Acceso concedido 🔓'), setTimeout(() => entrar('admin'), 500)) : toast('Contraseña incorrecta', 'error');
};
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
